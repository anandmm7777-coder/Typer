<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paragraph Typing | TypeMaster</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link rel="stylesheet" href="../css/typing.css">


</head>


<body class="paragraph-page">



<header class="typing-header">


<a href="../home.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</a>




<div class="page-title">

<i class="fa-solid fa-file-lines"></i>

<h2>
Paragraph Typing
</h2>

</div>




<button class="sound-btn">

<i class="fa-solid fa-volume-high"></i>

</button>



</header>





<main class="typing-container">



<section class="typing-card">





<div class="typing-info">



<div class="info-box">

<i class="fa-solid fa-clock"></i>

<span>
Time
</span>

<h3 id="timer">
60
</h3>

</div>





<div class="info-box">

<i class="fa-solid fa-gauge-high"></i>

<span>
WPM
</span>

<h3 id="wpm">
0
</h3>

</div>





<div class="info-box">

<i class="fa-solid fa-bullseye"></i>

<span>
Accuracy
</span>

<h3 id="accuracy">
100%
</h3>

</div>





<div class="info-box">

<i class="fa-solid fa-triangle-exclamation"></i>

<span>
Mistakes
</span>

<h3 id="mistakes">
0
</h3>

</div>




</div>
<!-- =========================
PARAGRAPH DISPLAY AREA
========================= -->


<div class="word-area">


<div class="word-title">

<i class="fa-solid fa-keyboard"></i>

<p>
Type the paragraph shown below
</p>

</div>





<div id="paragraphDisplay" class="word-display">

Click Start Button To Begin

</div>






<!-- INPUT BOX -->


<div class="input-area">

<textarea
id="typingInput"
class="paragraph-input"
placeholder="Type paragraph here..."
autocomplete="off"
autocorrect="off"
spellcheck="false"
disabled>
</textarea>


</div>






<!-- PROGRESS BAR -->


<div class="progress-container">


<div

class="progress-bar"

id="progressBar">

</div>


</div>







<!-- BUTTONS -->


<div class="controls">



<button

id="startBtn"

class="action-btn">


<i class="fa-solid fa-play"></i>


Start


</button>






<button

id="restartBtn"

class="action-btn secondary">


<i class="fa-solid fa-rotate-right"></i>


Restart


</button>




</div>



</section>







<!-- =========================
RESULT CARD
========================= -->


<section class="result-card" id="resultCard">



<div class="result-header">


<i class="fa-solid fa-chart-line"></i>


<h2>
Paragraph Result
</h2>


</div>







<div class="result-grid">



<div>

<i class="fa-solid fa-gauge-high"></i>

<h3 id="resultWpm">
0
</h3>

<p>
WPM
</p>

</div>







<div>

<i class="fa-solid fa-bullseye"></i>

<h3 id="resultAccuracy">
0%
</h3>

<p>
Accuracy
</p>

</div>







<div>

<i class="fa-solid fa-circle-xmark"></i>

<h3 id="resultMistakes">
0
</h3>

<p>
Mistakes
</p>

</div>



</div>







<button

class="save-btn"

id="saveResult">


<i class="fa-solid fa-floppy-disk"></i>


Save Result


</button>




</section>






</main>







<script src="../data/paragraphs.js"></script>

<script src="../js/paragraph.js"></script>



</body>

</html>
