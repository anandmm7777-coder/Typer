<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test - Splash Screen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- <link rel="stylesheet" href="style.css"> -->
  <style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#0f172a;
overflow:hidden;

}

#splash{

position:fixed;
width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#0f172a,#111827,#1e293b);

}

.glass{

width:360px;

padding:45px;

border-radius:30px;

backdrop-filter:blur(20px);

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.1);

box-shadow:
0 20px 50px rgba(0,0,0,.4);

text-align:center;

z-index:2;

animation:popup .8s ease;

}

.logo{

font-size:70px;

width:120px;
height:120px;

margin:auto;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:linear-gradient(135deg,#00E5FF,#00C853);

box-shadow:

0 0 50px rgba(0,229,255,.4);

animation:float 2s infinite ease-in-out;

}

h1{

margin-top:25px;

color:white;

font-size:34px;

font-weight:700;

letter-spacing:1px;

}

p{

margin-top:10px;

color:#cbd5e1;

font-size:15px;

}

.loader{

margin-top:35px;

width:100%;

height:8px;

background:rgba(255,255,255,.1);

border-radius:20px;

overflow:hidden;

}

.progress{

height:100%;

width:0;

background:linear-gradient(90deg,#00E5FF,#00C853);

border-radius:20px;

animation:loading 4s linear forwards;

}

#loadingText{

display:block;

margin-top:18px;

color:#00E5FF;

font-weight:600;

letter-spacing:1px;

}

.bg-circle{

position:absolute;

border-radius:50%;

filter:blur(80px);

opacity:.5;

}

.one{

width:300px;
height:300px;

background:#00E5FF;

left:-100px;
top:-100px;

animation:move1 10s infinite alternate;

}

.two{

width:350px;
height:350px;

background:#00C853;

right:-120px;
bottom:-120px;

animation:move2 10s infinite alternate;

}

@keyframes popup{

from{

transform:scale(.8);
opacity:0;

}

to{

transform:scale(1);
opacity:1;

}

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}

@keyframes loading{

100%{

width:100%;

}

}

@keyframes move1{

100%{

transform:translate(100px,100px);

}

}

@keyframes move2{

100%{

transform:translate(-100px,-80px);

}

}
  </style>
</head>
<body>

<div id="splash">

    <div class="bg-circle one"></div>
    <div class="bg-circle two"></div>

    <div class="glass">

        <div class="logo">
            ⌨️
        </div>

        <h1>TypeMaster</h1>

        <p>Professional Typing Test Platform</p>

        <div class="loader">
            <div class="progress"></div>
        </div>

        <span id="loadingText">Loading...</span>

    </div>

</div>

<script>
  const text = document.getElementById("loadingText");

const messages = [

"Loading Assets...",
"Preparing Keyboard...",
"Loading Words...",
"Optimizing Performance...",
"Almost Ready..."

];

let i = 0;

const interval = setInterval(()=>{

i++;

if(i < messages.length){

text.innerHTML = messages[i];

}

},800);

setTimeout(()=>{

clearInterval(interval);

window.location.href="login.html"; // Next Page

},4000);
</script>

</body>
</html>
