<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Google Sign In</title>

<link rel="stylesheet" href="style.css">

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>

</head>

<body>

<div class="container">

<div class="login-card">

<div class="logo">

<img src="https://www.gstatic.com/images/branding/product/2x/googleg_96dp.png" alt="Google Logo">

</div>

<h1>Welcome</h1>

<p>Sign in with your Google Account</p>

<button id="googleLoginBtn" class="google-btn">

<img src="https://developers.google.com/identity/images/g-logo.png">

<span>Sign in with Google</span>

</button>

<div class="footer">

<p>Powered by Google Authentication</p>

</div>

</div>

</div>

<script type="module" src="firebase-config.js"></script>

<script type="module" src="script.js"></script>

</body>
</html>
